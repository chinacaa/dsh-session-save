name: Publish to npm

# 用 npm Trusted Publishing（OIDC）发布：不需要 NPM_TOKEN，也不需要一次性验证码。
# npm 侧要有一条指向本文件的 trusted publisher 配置：
#   npm trust github dsh-session-save --file publish.yml --repo chinacaa/dsh-session-save --allow-publish
# 配好之后，手动触发本工作流或发布 Release 即可发布，并自动附带 provenance。
#
# 本工作流**只负责发布**，不跑测试。测试在干净 runner 上没有可靠前提（会话夹具曾依赖
# 「本机恰好有会话」，干净机器必然失败），而发布链路要的是「一条命令、结果确定」。
# 测试回归放在本机手动跑：
#   node test/client.mjs && node test/smoke.mjs && node test/open.mjs \
#     && node test/conflict.mjs && node test/dialog.mjs && node test/security.mjs
# 客户端词表按 navigator.language 分流，本机是中文机只测得到 ZH 一路，两条都要跑：
#   DSH_TEST_LOCALE=zh-CN node test/client.mjs && DSH_TEST_LOCALE=en-US node test/client.mjs
#
# windows-latest 保留：test/dialog.mjs 要真的拉起 Windows PowerShell + WinForms 保存/打开
# 对话框，Linux runner 上跑不了；这个插件本身也只支持 Windows。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不发布（npm publish --dry-run）'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # 换 OIDC token 用，Trusted Publishing 的必要条件

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # checkout/setup-node 都用 v5：v4 声明 runs.using: node20，已被 GitHub 强制迁移到
      # node24 并打印弃用警告；v5 起原生声明 node24，警告消失。
      - uses: actions/checkout@v5

      # Node 24 自带 npm 11；Trusted Publishing 要求 npm >= 11.5.1，这里再兜一层保险
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # 显式关掉 setup-node v5 的 package-manager 自动缓存。本仓库现在没有
          # packageManager 字段（不会触发），但发布走 OIDC + provenance，不该让缓存
          # 依赖“恰好没这个字段”这种偶然——写死关掉更稳。
          package-manager-cache: false

      - name: 确认 npm 版本支持 OIDC
        shell: bash
        run: |
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) { console.error('npm ' + v.join('.') + ' 太旧，需要 >= 11.5.1'); process.exit(1); }"

      - name: 语法检查
        shell: bash
        run: node --check index.js client.js

      # 六套测试全部跑：发布前的守门，任何一套红了就不发
      - name: 测试
        shell: bash
        run: |
          node test/client.mjs
          node test/smoke.mjs
          node test/open.mjs
          node test/conflict.mjs
          node test/dialog.mjs
          node test/security.mjs

      # client.js 按 navigator.language 选词表（/^en\b/i → EN，否则 ZH）。runner 是英文机，
      # 不钉 locale 就只能测到 EN 一路，中文词表等于没测；本地中文机反过来。两边各跑一轮，
      # 才不会出现「CI 绿、本地红」或反之。
      - name: 双语词表回归
        shell: bash
        run: |
          for loc in zh-CN en-US; do
            echo "── DSH_TEST_LOCALE=$loc ──"
            DSH_TEST_LOCALE=$loc node test/client.mjs
          done

      - name: 打包预览（dry run）
        if: ${{ inputs.dry_run }}
        shell: bash
        run: npm publish --dry-run --access public

      - name: 发布
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: npm publish --provenance --access public

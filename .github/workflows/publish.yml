name: Publish to npm

# 用 npm Trusted Publishing（OIDC）发布：不需要 NPM_TOKEN，也不需要一次性验证码。
# npm 侧要有一条指向本文件的 trusted publisher 配置：
#   npm trust github dsh-session-save --file publish.yml --repo chinacaa/dsh-session-save --allow-publish
# 配好之后，手动触发本工作流或发布 Release 即可发布，并自动附带 provenance。
#
# 本工作流**只负责发布**，不跑测试。测试要真跑起来得拉起 Windows PowerShell + WinForms
# 对话框、要写临时数据根，属于「本机发布前动作」而不是「发布链路的确定性步骤」；发布链路
# 只保留一条命令、结果确定的路径。测试回归在本机手动跑：
#   node test/client.mjs && node test/smoke.mjs && node test/open.mjs \
#     && node test/conflict.mjs && node test/dialog.mjs && node test/security.mjs
# 客户端词表按 navigator.language 分流，中英两条都要跑：
#   DSH_TEST_LOCALE=zh-CN node test/client.mjs && DSH_TEST_LOCALE=en-US node test/client.mjs
#
# windows-latest 保留：宿主与 Windows 原生对话框（powershell.exe + WinForms）都在这条
# runner 上验证过，换到 ubuntu 反而会掩盖 Windows 特有的编码/路径问题。插件本身跨平台，
# macOS / Linux 的对话框实现在本机另有验证。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不发布（npm publish --dry-run）'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # 换 OIDC token 用，Trusted Publishing 的必要条件

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # checkout/setup-node 都用 v5：v4 声明 runs.using: node20，已被 GitHub 强制迁移到
      # node24 并打印弃用警告；v5 起原生声明 node24，警告消失。
      - uses: actions/checkout@v5

      # Node 24 自带 npm 11；Trusted Publishing 要求 npm >= 11.5.1，这里再兜一层保险
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # 显式关掉 setup-node v5 的 package-manager 自动缓存。本仓库现在没有
          # packageManager 字段（不会触发），但发布走 OIDC + provenance，不该让缓存
          # 依赖“恰好没这个字段”这种偶然——写死关掉更稳。
          package-manager-cache: false

      - name: 确认 npm 版本支持 OIDC
        shell: bash
        run: |
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) { console.error('npm ' + v.join('.') + ' 太旧，需要 >= 11.5.1'); process.exit(1); }"

      # 只留语法检查：它零依赖、零副作用，能挡住「push 了半个语法错的文件」这种事故
      - name: 语法检查
        shell: bash
        run: node --check index.js client.js

      - name: 打包预览（dry run）
        if: ${{ inputs.dry_run }}
        shell: bash
        run: npm publish --dry-run --access public

      - name: 发布
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: npm publish --provenance --access public
